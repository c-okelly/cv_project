<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conor O'Kelly — CV</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f6f7f9;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.7rem 1.25rem;
      border-bottom: 1px solid #d9dce1;
      background: #ffffff;
    }
    header h1 {
      font-size: 1.05rem;
      margin: 0;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    header .links { white-space: nowrap; }
    header .links a {
      text-decoration: none;
      color: #0395de;
      font-weight: 500;
      font-size: 0.95rem;
      margin-left: 1.1rem;
    }
    header .links a:hover { text-decoration: underline; }
    main { flex: 1 1 auto; min-height: 0; }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <header>
    <h1>Conor O'Kelly — CV</h1>
    <nav class="links">
      <a href="cv.pdf" download="Conor-OKelly-CV.pdf">Download PDF</a>
      <a href="https://github.com/c-okelly/cv_project">Source</a>
    </nav>
  </header>
  <main>
    <iframe src="cv.pdf" title="Conor O'Kelly CV (PDF)"></iframe>
  </main>
</body>
</html>
